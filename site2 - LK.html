<!doctype html> 
<html lang="el"> 
<head> 
  <meta charset="utf-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1" /> 
  <title>Hogwarts Spell & Potion Manager</title> 
 
  <!-- Bootstrap 5 --> 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
rel="stylesheet"> 
 
  <style> 
    body{ 
      background: radial-gradient(900px 600px at 20% 10%, rgba(111,66,193,.20), 
transparent 60%), 
                  radial-gradient(800px 520px at 80% 20%, rgba(13,110,253,.18), 
transparent 60%), 
                  #0b1020; 
      color: rgba(255,255,255,.92); 
      min-height: 100vh; 
    } 
    .glass { 
      background: rgba(255,255,255,.06); 
      border: 1px solid rgba(255,255,255,.12); 
      backdrop-filter: blur(8px); 
    } 
    .muted { color: rgba(255,255,255,.65); } 
    .badge-soft-success { background: rgba(25,135,84,.18); border: 1px solid 
rgba(25,135,84,.35); } 
    .badge-soft-secondary { background: rgba(108,117,125,.16); border: 1px solid 
rgba(108,117,125,.30); } 
    .item-card { border: 1px solid rgba(255,255,255,.12); } 
    .item-active { box-shadow: 0 0 0 1px rgba(25,135,84,.25), 0 10px 30px 
rgba(0,0,0,.35); }
  .item-inactive { box-shadow: 0 10px 30px rgba(0,0,0,.25); } 
    .progress { background: rgba(255,255,255,.10); }
	ul {
  display: grid;
  gap: 2em;
}
  </style> 
</head> 
 
<body> 
  <div class="container py-4"> 
 
    <!-- Header --> 
    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content
between gap-3 mb-4"> 
      <div> 
        <h1 class="h3 mb-1">Hogwarts – Διαχειριστής Ξορκιών & Φίλτρων</h1> 
      </div> 
    </div> 
 
    <div class="row g-3"> 
      <!-- Form column --> 
      <div class="col-12 col-lg-4"> 
        <div class="card glass text-white"> 
          <div class="card-body"> 
            <h2 class="h5 mb-1">Προσθήκη Ξορκιού / Φίλτρου</h2> 
                      <!-- Warning box --> 
            <div id="warnBox" class="alert alert-danger d-none py-2 mb-3" 
role="alert"></div> 
 
            <div class="mb-3"> 
              <label class="form-label">Όνομα</label> 
              <input id="name" class="form-control bg-dark text-white border-light
subtle" placeholder="π.χ. Expelliarmus"> 
            </div> 
 
            <div class="row g-2"> 
              <div class="col-6"> 
                <label class="form-label">Τύπος</label> 
                <select id="type" class="form-select bg-dark text-white border-light
subtle"> 
                  <option>Ξόρκι</option> 
                  <option>Φίλτρο</option> 
                </select> 
              </div> 
              <div class="col-6"> 
                <label class="form-label">Στοιχείο</label> 
                <select id="element" class="form-select bg-dark text-white border
light-subtle"> 
                  <option>Φωτιά</option> 
                  <option>Πάγος</option> 
                  <option>Αστραπή</option> 
                  <option>Γη</option> 
                </select> 
              </div> 
            </div> 
 <div class="row g-2 mt-1"> 
              <div class="col-6"> 
                <label class="form-label">Δύναμη (1–100)</label> 
                <input id="power" type="number" min="1" max="100" value="40" 
                       class="form-control bg-dark text-white border-light-subtle"> 
              </div> 
              <div class="col-6"> 
                <label class="form-label">Σπανιότητα</label> 
                <select id="rarity" class="form-select bg-dark text-white border
light-subtle"> 
                  <option>Κοινό</option> 
                  <option>Σπάνιο</option> 
                  <option>Επικό</option> 
                  <option>Θρυλικό</option> 
                  <option>Ουαου</option> 
 
                </select> 
              </div> 
            </div> 
 
            <div class="mt-3"> 
              <label class="form-label">Περιγραφή</label> 
              <textarea id="desc" rows="3" 
                        class="form-control bg-dark text-white border-light-subtle" 
                        placeholder="Μια σύντομη περιγραφή..."></textarea> 
            </div> 
 
            <button id="addBtn" class="btn btn-primary w-100 mt-3" onclick="addMagicItemToTable()"> 
              Προσθήκη 
            </button> 
 
       
          </div> 
        </div> 
      </div> 
 
      <!-- List column --> 
      <div class="col-12 col-lg-6"> 
        <div class="card glass text-white"> 
          <div class="card-body"> 
            <div class="d-flex flex-column flex-md-row justify-content-between align
items-md-center gap-2 mb-3"> 
              <div> 
                <h2 class="h5 mb-1">Λίστα Μαγικών Αντικειμένων</h2> 
              </div> 
 
              <!-- Stats --> 
              <div id="stats" class="d-flex gap-2 flex-wrap"></div> 
            </div> 
 
            <!-- Container for items --> 
            <div id="labContainer"></div>
			
			
</div> 
</div> 
</div> 
<div class="col-12 col-lg-2"> 
        <div class="card glass text-white"> 
          <div class="card-body"> 
            <h2 class="h5 mb-1">Ενέργειες</h2>
			
				<div id="actionButtons"></div>
            
          </div> 
        </div> 
      </div> 
</div> 
<!-- Footer tip --> 
<div class="muted small mt-4"> 
Tip: Άνοιξε DevTools  για να βλέπεις errors/console logs όπως κάναμε στο μάθημα! 
</div>
</div>

<script>
//Table to store all magic items
let magicItems = [];
//Parallel table to store each magic item's action buttons! (by name)
let magicItemsActions = [];

//Object contructor 'MagicItem' (for creating each item)
function MagicItem(name, type, element, power, rarity, description, status)
{
  this.Name = name;
  this.Type = type;
  this.Element = element;
  this.Power = power;
  this.Rarity = rarity;
  this.Description = description;
  this.Status = status;
}
//Object contructor 'MagicItemActions' (for creating each item's action buttons)
function MagicItemActions(name)
{
	this.Name = name;
	this.EditButton;
	this.UpgradeButton;
    this.DeleteButton;        
}


function addMagicItemToTable()
{
	var tmp_name = document.getElementById("name").value;
	var tmp_type = document.getElementById("type").value;
	var tmp_element = document.getElementById("element").value;
	var tmp_power = document.getElementById("power").value;
	var tmp_rarity = document.getElementById("rarity").value;
	var tmp_description = document.getElementById("desc").value;
	if (tmp_type == "Ξόρκι")
	{
		tmp_status = "Μη μαθημένο";
	}
	else
	{
		tmp_status = "Μη παρασκευασμένο";
	}
	
	//Some names are not allowed (for technical reasons :D)
	if (tmp_name == "name" || tmp_name == "warnBox" || tmp_name == "type" || tmp_name == "element" || tmp_name == "power" || tmp_name == "rarity" || tmp_name == "desc" || tmp_name == "addBtn" || tmp_name == "stats" || tmp_name == "labContainer" || tmp_name == "actionButtons")
	{
		alert("Μη επιτρεπτό Όνομα!");
		return;
	}
	
	//Power must be in the range 1-100!
	if (tmp_power < 1 || tmp_power > 100)
	{
		alert("Μη επιτρεπτή τιμή Δύναμης!");
		return;
	}
    
	//Check for empty values! (where applicable)
	if (tmp_name.trim() == "" || tmp_power.trim() == "" || tmp_description.trim() == "")
	{
		//If empty value, alert user and exit function
		alert("Παρακαλώ συμπληρώστε όλα τα πεδία!");
		return;
	}
	
	//Check if the magic item already exists in the list! (by name)
	for (let i = 0; i < magicItems.length; i++)
	{
		//If the item exists, alert user and exit function
		if (tmp_name === magicItems[i].Name)
		{
			alert("Το Αντικείμενο υπάρχει ήδη!")
			return;
		}
	}
	
	//Create new MagicItem object and insert it into the array
	const newMagicItem = new MagicItem(tmp_name, tmp_type, tmp_element, tmp_power, tmp_rarity, tmp_description, tmp_status);
	magicItems.push(newMagicItem);
	//Create new parallel MagicItemActions object and insert it into the array
	const newMagicItemActions = new MagicItemActions(tmp_name);
	magicItemsActions.push(newMagicItemActions);

	//Call function to show all saved items in the magicItems array
	showMagicItems();
	//Call function to show all saved items in the magicItemsActions array
	showMagicItemsActions();
}

function showMagicItems()
{
	let text = "<ul>\n";
	for (let i = 0; i < magicItems.length; i++)
	{
		text += `<li id="${magicItems[i].Name}">` + magicItems[i].Name + ", " + magicItems[i].Type + ", " + magicItems[i].Element + ", " + magicItems[i].Power + ", " + magicItems[i].Rarity + ", " + magicItems[i].Description + ", " + magicItems[i].Status + "</li>\n";
	}
	text += "</ul>";
	
	//Re-write all availble items into the list
    document.getElementById("labContainer").innerHTML = text;
}

function showMagicItemsActions()
{
	let text = "";
	for (let i = 0; i < magicItemsActions.length; i++)
	{
		//Put the name of each magic item as an id to be able to find it later! (unique)
		magicItemsActions[i].EditButton = `<button id="${magicItemsActions[i].Name}" class="btn btn-primary w-1 mt-3" onclick="editMagicItem(id)"> &#9998; </button>`;
		magicItemsActions[i].UpgradeButton = `<button id="${magicItemsActions[i].Name}" class="btn btn-primary w-1 mt-3" onclick="upgradeMagicItem(id)"> &#8607; </button>`;
		magicItemsActions[i].DeleteButton = `<button id="${magicItemsActions[i].Name}" class="btn btn-primary w-1 mt-3" onclick="deleteMagicItem(id)"> &#10060; </button>`;
		text += magicItemsActions[i].EditButton + "\n" + magicItemsActions[i].UpgradeButton + "\n" + magicItemsActions[i].DeleteButton;
	}
	
	//Re-write the div
    document.getElementById("actionButtons").innerHTML = text;
}

function editMagicItem(id)
{
	let t_index;
	
	//Find Magic Item in table and change status to "Μαθημένο" or "Παρασκευασμένο" regarding its type (+inverted!)
	for (let i = 0; i < magicItems.length; i++)
	{
		if (magicItems[i].Name == id)
		{
			t_index = i;
		}
	}
	
	if (magicItems[t_index].Type == "Ξόρκι")
	{
		if (magicItems[t_index].Status == "Μη Μαθημένο")
		{
			magicItems[t_index].Status = "Μαθημένο";
		}
		else
		{
			magicItems[t_index].Status = "Μη Μαθημένο";
		}
	}
	else if (magicItems[t_index].Type == "Φίλτρο")
	{
		if (magicItems[t_index].Status == "Μη Παρασκευασμένο")
		{
			magicItems[t_index].Status = "Παρασκευασμένο";
		}
		else
		{
			magicItems[t_index].Status = "Μη Παρασκευασμένο";
		}
	}
	
	//Call function to show all saved items in the magicItems array again
	showMagicItems();
	//Call function to show all saved items in the magicItemsActions array again
	showMagicItemsActions();
}

function upgradeMagicItem(id)
{
	let t_index;
	
	//Find Magic Item in table and add +5 to its power (until 100!)
	for (let i = 0; i < magicItems.length; i++)
	{
		if (magicItems[i].Name == id)
		{
			t_index = i;
		}
	}
	
	if (parseInt(magicItems[t_index].Power) <= 95)
	{
		let num = parseInt(magicItems[t_index].Power) + 5;
		magicItems[t_index].Power = num;
	}
	else
	{
		//Add remainder to reach 100! (shows after alerting the user)
		let num = parseInt(magicItems[t_index].Power) + (100 - parseInt(magicItems[t_index].Power));
		magicItems[t_index].Power = num;
		alert("Υπέρβαση ορίου Δύναμης! (είσαι πολύ δυνατός :))");
	}
	
	//Call function to show all saved items in the magicItems array again
	showMagicItems();
	//Call function to show all saved items in the magicItemsActions array again
	showMagicItemsActions();
}

function deleteMagicItem(id)
{
	let t_index;
	
	//Find Magic Item in table and delete it (same goes for its actions on th parallel table)
	for (let i = 0; i < magicItems.length; i++)
	{
		if (magicItems[i].Name == id)
		{
			t_index = i;
		}
	}
	
	delete magicItems[t_index];
	//Re-assign the whole table after filtering out any 'falsy' values (ex. undefined)
	magicItems = magicItems.filter( Boolean );
	delete magicItemsActions[t_index];
	//Re-assign the whole table after filtering out any 'falsy' values (ex. undefined)
	magicItemsActions = magicItemsActions.filter( Boolean );
	
	//Call function to show all saved items in the magicItems array again
	showMagicItems();
	//Call function to show all saved items in the magicItemsActions array again
	showMagicItemsActions();
}
	
</script>

</body> 
</html>
